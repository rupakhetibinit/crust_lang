[package]
name = "crust"
version.workspace = true
edition.workspace = true

[[bin]]
name = "crust"
path = "src/main.rs"

[dependencies]
crust-frontend = { path = "../frontend" }
crust-backend = { path = "../backend" }
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "my_benchmark"
harness = false
